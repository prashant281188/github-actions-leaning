name: phase3-lab-1
run-name: feature branch running 

on:
  push:
    branches: ['main', 'feature']

jobs:

  test:
    runs-on: ubuntu-slim
    if: always()
    steps:
      - run: |
          echo "Branch  : ${{github.ref}}"
          echo "Actor   : ${{github.actor}}"
          
  deployment:
    needs: test
    runs-on: ubuntu-slim
    if: success() && github.ref == 'refs/heads/main'
    steps:
      - name: run
        run: echo "deployment running"
